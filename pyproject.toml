[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "meteor-cut"
version = "0.1.0"
description = "Find the meteors, satellites and planes in a night-sky video and make a highlight video, trajectory map and tables, tracked with Sky Tracker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deneb Systems", email = "contact@deneb-systems.com" }]
requires-python = ">=3.10"
keywords = [
  "meteor", "meteor shower", "astronomy", "astrophotography", "plate solving", "satellite", "video", "tracking", "opencv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "sky-tracker-sdk>=1.2",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pillow>=10.1",
  "imageio-ffmpeg>=0.5",
  "flask>=3.0",
]

[project.urls]
Homepage = "https://github.com/Deneb-Systems/meteor-cut"
Documentation = "https://github.com/Deneb-Systems/meteor-cut#readme"
Issues = "https://github.com/Deneb-Systems/meteor-cut/issues"
Changelog = "https://github.com/Deneb-Systems/meteor-cut/blob/main/CHANGELOG.md"
"Sky Tracker" = "https://sky-tracker.deneb-systems.com"

[project.scripts]
meteor-cut = "meteor_cut.cli:main"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.8", "mypy>=1.13"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "pre-commit>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/meteor_cut"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error", "ignore::DeprecationWarning:pkg_resources", "ignore:.*macro_block_size.*:UserWarning"]

[tool.coverage.run]
source = ["meteor_cut"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PTH", "PL", "RUF", "N", "S", "T20"]
ignore = [
  "PLR0913",  # functions with many keyword options are the public API's shape
  "PLR2004",  # thresholds are named where they are decisions; small literals stay inline
  "PLR0911", "PLR0912", "PLR0915",  # rule cascades and the scan loop read best in one place
  "RET504",
  "S101",  # asserts are fine in tests (ignored per file below), and absent from the package
  "PLC0415",  # lazy imports on purpose: ffmpeg, the web server and the SDK load only when used
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "PLR2004", "S108", "N802"]
"src/meteor_cut/cli.py" = ["T201"]
"src/meteor_cut/web/app.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["meteor_cut"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["cv2.*", "imageio_ffmpeg.*", "sky_tracker.*"]
ignore_missing_imports = true
