name: Idea
description: Something Meteor Cut could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The result you are after, and why. Example videos or pictures help.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
